<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Heart Assembly</title>
    <style>
        body {
            margin: 0;
            background-color: #050508;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .message {
            position: absolute;
            bottom: 60px;
            z-index: 2;
            color: #ff3366;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: lowercase;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.8), 0 0 30px rgba(255, 51, 102, 0.4);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.6; transform: scale(0.98); }
        }
    </style>
</head>
<body>

    <div class="message">FOR MY BAUNII</div>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Generate target coordinates for a big heart shape
        const heartPoints = [];
        for (let t = 0; t < Math.PI * 2; t += 0.03) {
            // Parametric equations for a heart
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            
            // Scale and center it slightly higher to make room for text below
            heartPoints.push({
                x: x * 15,
                y: y * 15 - 30
            });
        }

        class Particle {
            constructor(targetX, targetY) {
                // Start from random positions outside the screen
                this.x = (Math.random() - 0.5) * canvas.width * 1.5;
                this.y = (Math.random() - 0.5) * canvas.height * 1.5;
                
                // Destination inside the heart shape
                this.targetX = canvas.width / 2 + targetX;
                this.targetY = canvas.height / 2 + targetY;
                
                // Movement speed factor
                this.speed = 0.03 + Math.random() * 0.04;
                this.size = Math.random() * 2.5 + 1.5;
                this.color = Math.random() > 0.2 ? '#ff3366' : '#ff99cc';
            }

            update() {
                // Smoothly glide to the target shape
                this.x += (this.targetX - this.x) * this.speed;
                this.y += (this.targetY - this.y) * this.speed;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ff3366';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Create particles corresponding to the heart points
        const particles = [];
        heartPoints.forEach(pt => {
            for(let i = 0; i < 3; i++) {
                particles.push(new Particle(pt.x + (Math.random()-0.5)*10, pt.y + (Math.random()-0.5)*10));
            }
        });

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.2)'; // Creates a trailing glow effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>

</body>
</html>
